name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * *'  # 6am UTC / 2am Toronto — once daily
  workflow_dispatch:       # manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it partway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Rolling cache of the last good events file: the unique primary key always
      # misses so the post-job save always runs, while restore-keys pulls in the
      # newest previous entry. fetch_events.js reads it to fall back per-source
      # when a city API is down.
      - name: Cache toronto_events.json
        uses: actions/cache@v4
        with:
          path: toronto_events.json
          key: toronto-events-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: toronto-events-

      - name: Cache toronto_laptop_friendly.json
        uses: actions/cache@v4
        with:
          path: toronto_laptop_friendly.json
          key: laptop-friendly-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: laptop-friendly-

      - name: Fetch Toronto events
        env:
          # Concerts + sports schedules. If unset, those two sources skip
          # cleanly and the rest of the run is unaffected.
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          npm install
          node fetch_events.js

      # The deploy still runs daily for events; this scraper checks its cached
      # timestamp and only contacts Laptop Friendly once every seven days.
      - name: Fetch Laptop Friendly venues
        run: node fetch_laptop_friendly.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
