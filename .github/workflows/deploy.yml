name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * *'  # 6am UTC / 2am Toronto — once daily
  workflow_dispatch:       # manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Restore cached toronto_events.json
        uses: actions/cache@v4
        with:
          path: toronto_events.json
          key: toronto-events-${{ github.run_id }}
          restore-keys: |
            toronto-events-

      - name: Fetch Toronto events
        run: node fetch_events.js

      - name: Cache toronto_events.json
        uses: actions/cache/save@v4
        with:
          path: toronto_events.json
          key: toronto-events-${{ github.run_id }}

      - name: Allow toronto_events.json to be deployed
        run: sed -i '/toronto_events.json/d' .gitignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
